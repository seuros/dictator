[package]
name = "dictator"
version.workspace = true
description = "Dictator - structural linter framework with native and WASM decree support"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/seuros/dictator"
homepage = "https://github.com/seuros/dictator"
documentation = "https://docs.rs/dictator"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
usage = { workspace = true }
camino = { workspace = true }
dictator-core.workspace = true
dictator-freebsd.workspace = true
dictator-frontmatter.workspace = true
dictator-golang.workspace = true
dictator-decree-abi.workspace = true
dictator-python.workspace = true
dictator-ruby.workspace = true
dictator-rust.workspace = true
dictator-supreme.workspace = true
dictator-typescript.workspace = true
mcp-host = { version = "0.7.1", features = ["macros"] }
schemars = "1.2.2"
walkdir = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
notify-types = { workspace = true }
ctrlc = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["wasm-loader"]
wasm-loader = ["dictator-core/wasm-loader"]
