[workspace]
members = [
    "crates/dictator-core",
    "crates/dictator-decree-abi",
    "crates/dictator",
    "crates/dictator-ruby",
    "crates/dictator-supreme",
    "crates/dictator-typescript",
    "crates/dictator-golang",
    "crates/dictator-rust",
    "crates/dictator-python",
    "crates/dictator-frontmatter",
    "crates/dictator-coreboot",
    "crates/dictator-freebsd",
]
# WASM components require WASI SDK - build separately with:
# WASI_SYSROOT=/path/to/wasi-sysroot cargo build -p <decree> --target wasm32-wasip1
exclude = ["crates/dictator-kjr"]  # Enterprise productivity decree (GPL, WASM-only)
resolver = "2"

[workspace.package]
# The one version in the workspace. Members inherit via `version.workspace = true`.
version = "0.25.1" # x-release-please-version
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
repository = "https://github.com/seuros/dictator"
homepage = "https://github.com/seuros/dictator"

[workspace.dependencies]
# Every inter-crate dep lives here so there is one place to bump. release-please
# rewrites the block via extra-files; it cannot edit the workspace table itself.
# x-release-please-start-version
dictator-decree-abi = { version = "0.25.1", path = "crates/dictator-decree-abi" }
dictator-core = { version = "0.25.1", path = "crates/dictator-core" }
dictator-supreme = { version = "0.25.1", path = "crates/dictator-supreme" }
dictator-frontmatter = { version = "0.25.1", path = "crates/dictator-frontmatter" }
dictator-ruby = { version = "0.25.1", path = "crates/dictator-ruby" }
dictator-typescript = { version = "0.25.1", path = "crates/dictator-typescript" }
dictator-golang = { version = "0.25.1", path = "crates/dictator-golang" }
dictator-rust = { version = "0.25.1", path = "crates/dictator-rust" }
dictator-python = { version = "0.25.1", path = "crates/dictator-python" }
dictator-freebsd = { version = "0.25.1", path = "crates/dictator-freebsd" }
# x-release-please-end
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
jiff = "0.2"
usage-rs = "7"
rayon = "1"
dashmap = "6"
parking_lot = "0.12"
camino = "1"
walkdir = "2"
ignore = "0.4"
toml = "1"
serde_yaml = "0.9"
base64 = "0.23"
tokio = { version = "1", features = ["full"] }

# WASM + decree related (host side; decree crates may opt out)
wasmtime = { version = "49", default-features = true, features = ["component-model"] }
wit-component = "0.261"
wasmtime-wasi = { version = "49", default-features = true }
libloading = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = "8"
notify-types = "2"
state-machines = "0.30"
ctrlc = "3"
tempfile = "3"

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
# Release binaries are downloaded, not built, so size is a user-facing cost.
strip = true

[workspace.metadata]
# Placeholder for tool config.
