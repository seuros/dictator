[workspace]
members = [
    "crates/dictator-core",
    "crates/dictator-decree-abi",
    "crates/dictator",
    "crates/dictator-ruby",
    "crates/dictator-supreme",
    "crates/dictator-typescript",
    "crates/dictator-golang",
    "crates/dictator-rust",
    "crates/dictator-python",
    "crates/dictator-frontmatter",
    "crates/dictator-coreboot",
    "crates/dictator-freebsd",
]
# WASM components require WASI SDK - build separately with:
# WASI_SYSROOT=/path/to/wasi-sysroot cargo build -p <decree> --target wasm32-wasip1
exclude = ["crates/dictator-kjr"]  # Enterprise productivity decree (GPL, WASM-only)
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
repository = "https://github.com/seuros/dictator"
homepage = "https://github.com/seuros/dictator"

[workspace.dependencies]
# release-please bumps these two via extra-files; cargo-workspace does not
# rewrite the workspace table. Keep the annotations on the same line.
dictator-decree-abi = { version = "0.25.0", path = "crates/dictator-decree-abi" } # x-release-please-version
dictator-supreme = { version = "0.25.0", path = "crates/dictator-supreme" } # x-release-please-version
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
jiff = "0.2"
usage = { package = "usage-rs", version = "6" }
rayon = "1"
dashmap = "6"
parking_lot = "0.12"
camino = "1"
walkdir = "2"
ignore = "0.4"
toml = "1"
serde_yaml = "0.9"
base64 = "0.23"
tokio = { version = "1", features = ["full"] }

# WASM + decree related (host side; decree crates may opt out)
wasmtime = { version = "49", default-features = true, features = ["component-model"] }
wit-component = "0.259"
wasmtime-wasi = { version = "49", default-features = true }
libloading = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = "8"
notify-types = "2"
state-machines = "0.21"
ctrlc = "3"
tempfile = "3"

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
# Release binaries are downloaded, not built, so size is a user-facing cost.
strip = true

